[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["D:", "notebooks"]

[tool.ruff.lint]
# Correctness rules only (syntax errors, undefined names, unused imports and variables).
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
